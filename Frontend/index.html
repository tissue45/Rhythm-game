<!doctype html>
<html lang="ko">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StepUp - Rhythm Action School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap"
  rel="stylesheet">
  <script type="text/javascript">
    // GitHub Pages SPA redirect handler
    (function() {
      var search = window.location.search;
      // game/index.html에서 리다이렉트: ?p=game
      var params = new URLSearchParams(search);
      var p = params.get('p');
      if (p) {
        window.history.replaceState(null, null, '/Rhythm-game/' + p);
      }
      // 404.html에서 리다이렉트: /?/path
      else if (search[1] === '/') {
        var decoded = search.slice(1).split('&').map(function(s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null,
          window.location.pathname.slice(0, -1) + decoded + window.location.hash
        );
      }
    })();
  </script>
</head>

<body>
  <div id="root"
    style="background-color: black; color: white; display: flex; justify-content: center; align-items: center; height: 100vh;">
    Loading App...
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
